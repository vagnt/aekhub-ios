# AEK Hub — iPhone / iPad / Apple Watch
# Το .xcodeproj ΔΕΝ μπαίνει στο repo: το φτιάχνει το XcodeGen από αυτό το αρχείο (στο GitHub Actions ή σε Mac: `xcodegen generate`).
name: AEKHub
options:
  bundleIdPrefix: gr.aekhub
  deploymentTarget:
    iOS: "16.2"
    watchOS: "9.0"
  createIntermediateGroups: true
  developmentLanguage: el
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: H3BX78S223
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    # AdMob App ID της εφαρμογής iOS (AdMob → Apps → AEK Hub iOS → App settings)
    ADMOB_APP_ID: ca-app-pub-7943059111940021~6196572715

# Διαφημίσεις: Google Mobile Ads (AdMob) + συγκατάθεση GDPR (UMP) — μόνο στην εφαρμογή iPhone/iPad
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    majorVersion: 11.13.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    majorVersion: 2.7.0
  # Ειδοποιήσεις push μέσω Firebase Cloud Messaging (ίδια topics με το Android)
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 11.15.0

targets:
  AEKHub:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: Resources/Fonts
        buildPhase: resources
      # Firebase (push μέσω FCM): δημόσιες ρυθμίσεις, όπως το google-services.json του Android
      - path: Resources/Firebase
        buildPhase: resources
      # Δήλωση απορρήτου (Apple): τι δεδομένα μαζεύει η εφαρμογή και γιατί
      - path: Resources/Privacy
        buildPhase: resources
      # Splash ανοίγματος (βίντεο του χρήστη): κινητό / iPad κάθετο / iPad οριζόντιο
      - path: Resources/Splash
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gr.aekhub.app
        PRODUCT_NAME: AEKHub
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: AEK Hub
    entitlements:
      path: iOS/AEKHub.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.gr.aekhub.app]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: AEK Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: el
        LSApplicationQueriesSchemes: [instagram, fb, twitter, youtube, tiktok]
        UIAppFonts:
          - Manrope-Medium.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
          - SofiaSans-ExtraBold.ttf
          - SofiaSans-Black.ttf
        UILaunchScreen:
          UIColorName: LaunchBg
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # AdMob
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        NSUserTrackingUsageDescription: Οι διαφημίσεις που βλέπεις θα ταιριάζουν περισσότερο σε σένα. Έτσι στηρίζεις το AEK Hub να μένει δωρεάν.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
          - SKAdNetworkIdentifier: y5ghdn5j9k.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: kbd757ywx3.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: ppxm28t8ap.skadnetwork
          - SKAdNetworkIdentifier: uw77j35x4d.skadnetwork
          - SKAdNetworkIdentifier: pwa73g5rt2.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: tl55sbb4fm.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
        # Έλεγχος αγώνων στο παρασκήνιο (τοπικές ειδοποιήσεις χωρίς push) — το iOS αποφασίζει πόσο συχνά
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [gr.aekhub.app.refresh]
        # aekhub://match/123 · aekhub://post/123 (widgets, ειδοποιήσεις)
        CFBundleURLTypes:
          - CFBundleURLName: gr.aekhub.app
            CFBundleURLSchemes: [aekhub]
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: matches
            UIApplicationShortcutItemTitle: Αγώνες
            UIApplicationShortcutItemIconSymbolName: soccerball
          - UIApplicationShortcutItemType: standings
            UIApplicationShortcutItemTitle: Βαθμολογίες
            UIApplicationShortcutItemIconSymbolName: list.number
          - UIApplicationShortcutItemType: search
            UIApplicationShortcutItemTitle: Αναζήτηση
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeSearch
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
      - package: Firebase
        product: FirebaseMessaging
      - target: AEKHubWidgets
        embed: true
      - target: AEKHubNotify
        embed: true
      - target: AEKHubControls
        embed: true
      # Η εφαρμογή του ρολογιού μπαίνει ΜΕΣΑ στο .ipa του iPhone (φάκελος Watch)
      - target: AEKHubWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    scheme: {}

  # Ειδοποιήσεις push: ήσυχες ώρες / χωρίς spoilers στο κινητό, πριν εμφανιστεί η ειδοποίηση
  AEKHubNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: Notify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gr.aekhub.app.notify
        PRODUCT_NAME: AEKHubNotify
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    entitlements:
      path: Notify/AEKHubNotify.entitlements
      properties:
        com.apple.security.application-groups: [group.gr.aekhub.app]
    info:
      path: Notify/Info.plist
      properties:
        CFBundleDisplayName: AEK Hub Notify
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  AEKHubWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gr.aekhub.app.watchkitapp
        PRODUCT_NAME: AEKHubWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: AEK Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: el
        WKApplication: true
        WKCompanionAppBundleIdentifier: gr.aekhub.app
        CFBundleURLTypes:
          - CFBundleURLName: gr.aekhub.app.watchkitapp
            CFBundleURLSchemes: [aekhub]
        WKRunsIndependentlyOfCompanionApp: true
    dependencies:
      - target: AEKHubWatchWidgets
        embed: true
    scheme: {}

  # Widgets iPhone/iPad (οθόνη αφετηρίας + οθόνη κλειδώματος)
  AEKHubWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gr.aekhub.app.widgets
        PRODUCT_NAME: AEKHubWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    entitlements:
      path: Widgets/AEKHubWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.gr.aekhub.app]  # λογότυπα Live Activity (LiveLogos)
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: AEK Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Manrope-Medium.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
          - SofiaSans-ExtraBold.ttf
          - SofiaSans-Black.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # 🎛 Control Center (iOS 18+): «Αγώνας ΑΕΚ»
  AEKHubControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Controls
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gr.aekhub.app.controls
        PRODUCT_NAME: AEKHubControls
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: AEK Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Complications Apple Watch
  AEKHubWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gr.aekhub.app.watchkitapp.widgets
        PRODUCT_NAME: AEKHubWatchWidgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: AEK Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
