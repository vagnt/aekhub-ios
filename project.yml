# AEK Hub — iPhone / iPad / Apple Watch
# Το .xcodeproj ΔΕΝ μπαίνει στο repo: το φτιάχνει το XcodeGen από αυτό το αρχείο (στο GitHub Actions ή σε Mac: `xcodegen generate`).
name: AEKHub
options:
  bundleIdPrefix: gr.aekhub
  deploymentTarget:
    iOS: "16.2"
    watchOS: "9.0"
  createIntermediateGroups: true
  developmentLanguage: el
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  AEKHub:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gr.aekhub.app
        PRODUCT_NAME: AEKHub
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: AEK Hub
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: AEK Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: el
        LSApplicationQueriesSchemes: [instagram, fb, twitter, youtube, tiktok]
        UIAppFonts:
          - Manrope-Medium.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
          - SofiaSans-ExtraBold.ttf
          - SofiaSans-Black.ttf
        UILaunchScreen:
          UIColorName: LaunchBg
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # Έλεγχος αγώνων στο παρασκήνιο (τοπικές ειδοποιήσεις χωρίς push) — το iOS αποφασίζει πόσο συχνά
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [gr.aekhub.app.refresh]
        # aekhub://match/123 · aekhub://post/123 (widgets, ειδοποιήσεις)
        CFBundleURLTypes:
          - CFBundleURLName: gr.aekhub.app
            CFBundleURLSchemes: [aekhub]
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: matches
            UIApplicationShortcutItemTitle: Αγώνες
            UIApplicationShortcutItemIconSymbolName: soccerball
          - UIApplicationShortcutItemType: standings
            UIApplicationShortcutItemTitle: Βαθμολογίες
            UIApplicationShortcutItemIconSymbolName: list.number
          - UIApplicationShortcutItemType: search
            UIApplicationShortcutItemTitle: Αναζήτηση
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeSearch
    dependencies:
      - target: AEKHubWidgets
        embed: true
      # Η εφαρμογή του ρολογιού μπαίνει ΜΕΣΑ στο .ipa του iPhone (φάκελος Watch)
      - target: AEKHubWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    scheme: {}

  AEKHubWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gr.aekhub.app.watchkitapp
        PRODUCT_NAME: AEKHubWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: AEK Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: el
        WKApplication: true
        WKCompanionAppBundleIdentifier: gr.aekhub.app
        WKRunsIndependentlyOfCompanionApp: true
    dependencies:
      - target: AEKHubWatchWidgets
        embed: true
    scheme: {}

  # Widgets iPhone/iPad (οθόνη αφετηρίας + οθόνη κλειδώματος)
  AEKHubWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gr.aekhub.app.widgets
        PRODUCT_NAME: AEKHubWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: AEK Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Manrope-Medium.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
          - SofiaSans-ExtraBold.ttf
          - SofiaSans-Black.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Complications Apple Watch
  AEKHubWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gr.aekhub.app.watchkitapp.widgets
        PRODUCT_NAME: AEKHubWatchWidgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: AEK Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
