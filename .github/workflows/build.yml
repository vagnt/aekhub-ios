name: Build IPA

# Σε κάθε push φτιάχνει ΑΝΥΠΟΓΡΑΦΟ .ipa (iPhone + iPad + Apple Watch μέσα)
# για sideload με Sideloadly / AltStore (υπογράφουν αυτά με το Apple ID του χρήστη).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          # Το νεότερο Xcode (26 = Liquid Glass του iOS 26· αλλιώς 16)
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|watchos" || true
          # Αν λείπει το SDK του ρολογιού, κατέβασέ το
          xcodebuild -showsdks | grep -q watchos || xcodebuild -downloadPlatform watchOS

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project AEKHub.xcodeproj -scheme AEKHub -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build > build.log 2>&1
          grep -E "\*\* BUILD" build.log

      - name: Errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -60 | while IFS= read -r l; do echo "::error::$l"; done
          grep -E -A3 "error:" build.log | grep -v "^/Applications" | cut -c1-300 | head -120

      - name: IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/AEKHub.app
          ls "$APP" "$APP/Watch" || true
          V=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"(.*)".*/\1/')
          mkdir Payload && cp -R "$APP" Payload/
          IPA="AEKHub-iOS-$V-build${{ github.run_number }}.ipa"
          zip -qry "$IPA" Payload
          echo "IPA=$IPA" >> $GITHUB_ENV
          ls "Payload/AEKHub.app/PlugIns" "Payload/AEKHub.app/Watch/AEKHubWatch.app/PlugIns" || true
          # Δεύτερο .ipa ΧΩΡΙΣ Apple Watch (αν ο δωρεάν λογαριασμός Apple σκαλώσει στο όριο εφαρμογών/App IDs)
          rm -rf Payload/AEKHub.app/Watch
          LITE="AEKHub-iOS-$V-build${{ github.run_number }}-xoris-roloi.ipa"
          zip -qry "$LITE" Payload
          echo "LITE=$LITE" >> $GITHUB_ENV
          echo "VER=$V" >> $GITHUB_ENV
          ls -la "$IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: |
            ${{ env.IPA }}
            ${{ env.LITE }}

      - name: Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: AEK Hub iOS ${{ env.VER }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            ${{ env.IPA }}
            ${{ env.LITE }}

      # 📦 Δημόσια διανομή σε φίλους (AltStore/SideStore «πηγή»): ανεβαίνει στο ΔΗΜΟΣΙΟ repo vagnt/aekhub-ios-dist.
      # Μόνο από το κύριο branch και μόνο αν υπάρχει το secret DIST_TOKEN (token με δικαίωμα γραφής ΜΟΝΟ σε εκείνο το repo).
      - name: Public release (aekhub-ios-dist)
        id: pub
        if: github.ref_name == github.event.repository.default_branch && env.DIST_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: vagnt/aekhub-ios-dist
          token: ${{ secrets.DIST_TOKEN }}
          tag_name: v${{ env.VER }}-build${{ github.run_number }}
          name: AEK Hub ${{ env.VER }} (build ${{ github.run_number }})
          make_latest: true
          body: |
            Εγκατάσταση: AltStore / SideStore → Sources → «+» → https://raw.githubusercontent.com/vagnt/aekhub-ios-dist/main/source.json
            Ή κατέβασε το .ipa και πέρασέ το με Sideloadly (δωρεάν Apple ID, ανανέωση κάθε 7 μέρες).
          files: |
            ${{ env.IPA }}
            ${{ env.LITE }}

      - name: AltStore source (source.json)
        if: steps.pub.outcome == 'success'
        run: |
          git clone -q "https://x-access-token:${DIST_TOKEN}@github.com/vagnt/aekhub-ios-dist.git" distrepo
          cp dist/icon.png distrepo/icon.png
          URL="https://github.com/vagnt/aekhub-ios-dist/releases/download/v${VER}-build${{ github.run_number }}/${LITE}"
          python3 dist/make_source.py distrepo "$VER" "${{ github.run_number }}" "$URL" "$(stat -f%z "$LITE")"
          cd distrepo
          git config user.name "AEK Hub build"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "AEK Hub $VER (build ${{ github.run_number }})" && git push -q origin HEAD:main || echo "τίποτα νέο"

  # 📸 Screenshots από προσομοιωτή (iPhone + iPad): έλεγχος εμφάνισης χωρίς συσκευή
  screens:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -20
      - name: Build (simulator)
        run: |
          brew install xcodegen && xcodegen generate
          xcodebuild -project AEKHub.xcodeproj -scheme AEKHub -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath sim CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 || { grep -E "error:" sim.log | head -40; exit 1; }
      - name: Screenshots
        env:
          MATCH: "214093"
          MATCH2: "215042"
          POST: "218069"
          POST2: "218062"
        run: bash ci/screens.sh sim/Build/Products/Debug-iphonesimulator/AEKHub.app shots
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: shots/*.png

  # ── TestFlight: υπογραφή με τον λογαριασμό Apple Developer και ανέβασμα (χωρίς Mac) ──
  # Θέλει τα secrets ASC_ISSUER_ID, ASC_KEY_ID, ASC_KEY_P8 (κλειδί App Store Connect API, ρόλος Admin).
  # Χωρίς αυτά απλώς παραλείπεται. Το Xcode φτιάχνει μόνο του πιστοποιητικά/προφίλ (-allowProvisioningUpdates).
  testflight:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Έλεγχος κλειδιών
        id: keys
        run: |
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ]; then echo "ok=1" >> $GITHUB_OUTPUT; else echo "Λείπουν τα secrets ASC_* — παράλειψη TestFlight"; fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == '1'

      - name: Xcode
        if: steps.keys.outputs.ok == '1'
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcodebuild -showsdks | grep -q watchos || xcodebuild -downloadPlatform watchOS
          brew install xcodegen
          xcodegen generate

      - name: Archive (υπογραφή)
        if: steps.keys.outputs.ok == '1'
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          echo "AUTHKEY=$KEY" >> $GITHUB_ENV
          set -o pipefail
          xcodebuild -project AEKHub.xcodeproj -scheme AEKHub -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/AEKHub.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive > archive.log 2>&1 || { grep -E "error|Error|requires|No profiles|no devices" archive.log | sed 's/^/::error::/' | head -40; exit 1; }
          grep -E "\*\* ARCHIVE" archive.log

      - name: Ανέβασμα στο TestFlight
        if: steps.keys.outputs.ok == '1'
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AEKHub.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$AUTHKEY" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > export.log 2>&1 || { grep -iE "error|fail|invalid|missing" export.log | sed 's/^/::error::/' | head -60; exit 1; }
          tail -20 export.log
          echo "✅ Ανέβηκε στο TestFlight (build ${{ github.run_number }}). Σε 5–30′ εμφανίζεται στο App Store Connect → TestFlight."

      - name: Καθάρισμα κλειδιού
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
